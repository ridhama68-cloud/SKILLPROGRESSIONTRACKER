<body><div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">↗</span><span class="brandtext">steady</span></div><div class="workspace"><div class="avatar">J</div><div><div class="wslabel">YOUR WORKSPACE</div><div class="wsname" id="userName">Jordan's practice</div></div><span style="margin-left:auto;color:#a0a49b">⌄</span></div><div><div class="navlabel">WORKSPACE</div><nav class="nav"><button data-page="overview" class="active"><span class="navicon">◫</span><span class="navtext">Overview</span></button><button data-page="log"><span class="navicon">＋</span><span class="navtext">Daily log</span></button><button data-page="reports"><span class="navicon">▥</span><span class="navtext">Reports</span></button><button data-page="coach"><span class="navicon">✳</span><span class="navtext">Your coach</span></button></nav></div><div><div class="navlabel">PREFERENCES</div><nav class="nav"><button data-page="settings"><span class="navicon">⚙</span><span class="navtext">Settings</span></button></nav></div><div class="side-bottom">Small steps, real progress.<br>Keep showing up for your craft.</div></aside><main class="main"><header class="topbar"><div class="crumb">Workspace <span style="padding:0 7px;color:#c2c4bd">/</span> <b id="crumb">Overview</b></div><div class="top-actions"><span class="date-pill" id="datePill"></span><button class="iconbtn" title="Notifications">♧</button><div class="avatar" style="width:32px;height:32px">J</div></div></header><div class="content" id="content"></div></main></div><div class="modal-backdrop" id="modal"><div class="modal"><div class="modalhead"><h2>Add a practice</h2><button class="close" id="closeModal">×</button></div><div class="field"><label>What do you want to work on?</label><input id="newName" placeholder="e.g. Practice piano scales"></div><div class="twocol"><div class="field"><label>Practice area</label><select id="newCategory"><option>Craft</option><option>Strength</option><option>Business</option><option>Wellbeing</option><option>Other</option></select></div><div class="field"><label>Frequency</label><select id="newFrequency"><option>Daily</option><option>Weekdays</option><option>3× / week</option><option>Weekly</option></select></div></div><div class="field"><label>How do you want to track it?</label><div class="type-toggle"><button class="chosen" data-type="binary">Done / not yet</button><button data-type="quantitative">A number</button></div></div><div class="field" id="unitField" style="display:none"><label>Unit (minutes, reps, kg…)</label><input id="newUnit" placeholder="e.g. minutes"></div><div class="field" id="directionField" style="display:none"><label>Which direction means progress?</label><select id="newDirection"><option value="up">A higher number</option><option value="down">A lower number</option></select></div><div class="field"><label>Weekly target (optional)</label><input id="newTarget" placeholder="e.g. 5 sessions"></div><div class="modalfoot"><button class="secondary" id="cancelModal">Cancel</button><button class="primary" id="saveTask">Add practice</button></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='steady-mvp-v1'; const fmtDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>fmtDate(new Date()); const plusDays=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return fmtDate(d)};const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2,9);
function starter(){return {user:'Jordan',tasks:[{id:'flow',name:'Write a 16-bar flow',category:'Craft',frequency:'Daily',type:'binary',unit:'',target:'5 sessions',created:plusDays(-20)},{id:'sidechain',name:'Practice sidechain compression',category:'Craft',frequency:'3× / week',type:'quantitative',unit:'minutes',target:'90 min',created:plusDays(-20)},{id:'walk',name:'Get outside for a walk',category:'Wellbeing',frequency:'Daily',type:'binary',unit:'',target:'5 sessions',created:plusDays(-20)}],logs:{},metrics:{}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||starter()}catch(e){state=starter()}let selectedType='binary',currentPage='overview';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function logFor(date,id){return (state.logs[date]||{})[id]||{done:false,value:'',friction:''}}function dayNum(d){return new Date(d+'T12:00:00').getDay()}function isAssigned(t,d){if(d<t.created)return false;let w=dayNum(d);return t.frequency==='Daily'||(t.frequency==='Weekdays'&&w>0&&w<6)||(t.frequency==='3× / week'&&[1,3,5].includes(w))||(t.frequency==='Weekly'&&w===1)}function assigned(task,days){let count=0;for(let n=0;n<days;n++){if(isAssigned(task,plusDays(-n)))count++}return count}function completed(task,days){let c=0;for(let n=0;n<days;n++){let d=plusDays(-n);if(isAssigned(task,d)&&logFor(d,task.id).done)c++}return c}function pct(a,b){return b?Math.round(a/b*100):0}function avgMetric(id,days){let vals=[];for(let n=0;n<days;n++){const l=logFor(plusDays(-n),id);if(l.done&&l.value!==''&&Number.isFinite(Number(l.value)))vals.push(Number(l.value))}return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0}function metricData(id){const xs=[];for(let n=29;n>=0;n--){const l=logFor(plusDays(-n),id);if(l.done&&l.value!==''&&Number.isFinite(Number(l.value)))xs.push({date:plusDays(-n),v:Number(l.value)})}return xs}function improvement(id){let d=metricData(id);if(d.length<2)return null;const half=Math.max(1,Math.floor(d.length/2)),a=d.slice(0,half).reduce((s,x)=>s+x.v,0)/half,b=d.slice(-half).reduce((s,x)=>s+x.v,0)/half;return a===0?null:Math.round((b-a)/Math.abs(a)*100)*(state.tasks.find(t=>t.id===id)?.direction==='down'?-1:1)}function overall(days){let a=0,c=0;state.tasks.forEach(t=>{a+=assigned(t,days);c+=completed(t,days)});return pct(c,a)}function coachAdvice(){let comp=overall(7),high=state.tasks.filter(t=>t.type==='quantitative').map(t=>({t,p:improvement(t.id)})).filter(x=>x.p!==null);let lowImp=high.filter(x=>x.p<5),missed=[];for(let i=0;i<7;i++){let d=plusDays(-i);Object.values(state.logs[d]||{}).forEach(x=>{if(!x.done&&x.friction)missed.push(x.friction)})}let counts={};missed.forEach(s=>counts[s]=(counts[s]||0)+1);let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];let spikes=[];for(let i=0;i<4;i++){let dc=state.tasks.filter(t=>logFor(plusDays(-i),t.id).done).length, d0=state.tasks.filter(t=>logFor(plusDays(-i-1),t.id).done).length;if(i<3&&dc>0&&d0===0)spikes.push(true)}if(spikes.length)return {title:'Give your practice a rhythm',body:'You had a strong day followed by a quiet one. Try setting a lighter recovery day between bigger sessions so your progress has room to settle.'};if(top&&comp<70)return {title:'Make the first step smaller',body:`You logged “${top[0]}” as a blocker most often. Could you turn one session into a 10-minute starter? A smaller start can make it easier to build a reliable rhythm.`};if(lowImp.length)return {title:'Ready for a little more challenge?',body:`You’re showing up for ${lowImp[0].t.name.toLowerCase()}, and your recent numbers look steady. Try one small progression next session: add a few minutes, raise the difficulty, or change one constraint.`};if(comp>=80)return {title:'Your consistency is building',body:'You are making a solid habit of showing up. Keep the rhythm, and record one measurable result after each session so your skill growth becomes easier to spot.'};if(missed.length)return {title:'Notice what gets in the way',body:`You’ve captured ${missed.length} friction note${missed.length===1?'':'s'} this week. Look for a way to make the next session simpler to start, then see if that changes your follow-through.`};return {title:'Start with one small rep',body:'Log a session and a measurable result to give your coach something useful to work with. Progress is easier to see when you capture the starting point.'}}
function taskProgressCard(t){let n=assigned(t,7),c=completed(t,7);return `<div class="taskrow"><div><div class="taskname">${esc(t.name)}</div><div class="taskmeta">${esc(t.frequency)}${t.type==='quantitative'?' · '+esc(t.unit):''}</div></div><span class="tag">${esc(t.category)}</span><div><div class="progressline"><span style="width:${pct(c,n)}%"></span></div><div class="taskmeta" style="margin-top:6px">${c} of ${n} sessions</div></div><div class="taskmeta">${t.target?'Goal: '+esc(t.target):'No weekly goal'}</div><button class="checkbtn ${logFor(today(),t.id).done?'done':''}" data-toggle="${t.id}">${logFor(today(),t.id).done?'✓ Done today':'Log today'}</button></div>`}
function weeklyChart(){let ds=Array.from({length:7},(_,i)=>plusDays(i-6));let daily=ds.map(d=>{let a=state.tasks.filter(t=>isAssigned(t,d)).length,c=state.tasks.filter(t=>isAssigned(t,d)&&logFor(d,t.id).done).length;return a?pct(c,a):0});let max=Math.max(100,...daily);return ds.map((d,i)=>{let mv=state.tasks.filter(t=>t.type==='quantitative').map(t=>metricData(t.id).find(x=>x.date===d)?.v||0).filter(Boolean);let q=mv.length?Math.min(100,Math.round(mv.reduce((a,b)=>a+b,0)/mv.length)):0;return `<div class="bar-day"><div class="bar-pair"><div class="bar" title="${daily[i]}% completion" style="height:${Math.max(daily[i]?4:0,daily[i]/max*100)}%"></div><div class="bar improve" title="Quantitative result logged" style="height:${q?45:0}%"></div></div><span class="barlabel">${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})}</span></div>`}).join('')}
function renderOverview(){let advice=coachAdvice(),quant=state.tasks.filter(t=>t.type==='quantitative'),avgImp=quant.map(t=>improvement(t.id)).filter(v=>v!==null),skill=avgImp.length?Math.round(avgImp.reduce((a,b)=>a+b,0)/avgImp.length):null;return `<div class="pagehead"><div><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>Good to see you, ${esc(state.user)}.</h1><p class="subtitle">A clear look at the work you’re putting in—and what’s changing.</p></div><button class="primary" id="addTask">＋ &nbsp;Add a practice</button></div><div class="grid"><div class="card stat"><div class="stat-top"><span>Weekly consistency</span><span class="stat-icon">◷</span></div><div class="stat-value">${overall(7)}%</div><div class="stat-foot">${state.tasks.reduce((s,t)=>s+completed(t,7),0)} sessions logged this week</div></div><div class="card stat"><div class="stat-top"><span>Monthly consistency</span><span class="stat-icon">▦</span></div><div class="stat-value">${overall(30)}%</div><div class="stat-foot">Across your assigned practices</div></div><div class="card stat"><div class="stat-top"><span>Skill signal</span><span class="stat-icon">↗</span></div><div class="stat-value">${skill===null?'—':(skill>0?'+':'')+skill+'%'}</div><div class="stat-foot">${skill===null?'Log a number to see change':'Recent vs. earlier sessions'}</div></div><div class="card stat"><div class="stat-top"><span>Practice areas</span><span class="stat-icon">✳</span></div><div class="stat-value">${state.tasks.length}</div><div class="stat-foot">Keep the focus manageable</div></div><div class="card chartcard"><div class="cardhead"><div><div class="cardtitle">Your practice, over time</div><div class="cardhint">Daily sessions and quantitative results</div></div><select class="select"><option>Last 7 days</option></select></div><div class="chart">${weeklyChart()}</div><div class="legend"><span><i class="dot"></i>Completion rate</span><span><i class="dot dot2"></i>Skill data logged</span></div></div><div class="card focuscard"><div class="cardtitle">A thought for this week</div><div class="cardhint">Based on your recent practice</div><div class="coach"><div class="coachlabel"><span>✳</span>${esc(advice.title)}</div><p>${esc(advice.body)}</p><button class="coachlink" data-goto="coach">See your coaching notes →</button></div></div><div style="grid-column:span 12"><div class="sectiontitle" style="margin-top:8px">Your practices <span style="font:400 11px 'DM Sans';color:var(--muted)">· this week</span></div><div class="card taskcard"><div class="taskrow head"><span>Practice</span><span>Area</span><span>Weekly rhythm</span><span>Weekly goal</span><span>Today</span></div>${state.tasks.length?state.tasks.map(taskProgressCard).join(''):'<div class="empty" style="padding:20px">Add a practice to get started.</div>'}</div></div></div>`}
function renderLog(){let d=today(),done=state.tasks.filter(t=>logFor(d,t.id).done).length;return `<div class="pagehead"><div><div class="eyebrow">Your daily check-in</div><h1>Log today’s practice</h1><p class="subtitle">A quick note now makes your weekly review more useful.</p></div><span class="date-pill">${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</span></div><div class="grid"><div class="card loggrid"><div class="cardhead"><div><div class="cardtitle">Today’s practices</div><div class="cardhint">${done} of ${state.tasks.length} logged so far</div></div></div>${state.tasks.length?state.tasks.map(t=>{let x=logFor(d,t.id);return `<div class="logrow"><div class="logleft"><button class="checkbox ${x.done?'checked':''}" data-toggle="${t.id}">${x.done?'✓':''}</button><div><div class="logtask">${esc(t.name)}</div><div class="logdetail">${esc(t.category)} · ${esc(t.frequency)}</div></div></div><div style="min-width:122px;text-align:right">${t.type==='quantitative'?`<input class="loginput" style="width:120px;margin:0" type="number" min="0" step="any" placeholder="${esc(t.unit||'value')}" value="${esc(x.value)}" data-value="${t.id}">`:`<span class="logdetail">${x.done?'Nice work.':'Mark complete'}</span>`}</div></div>${!x.done?`<input class="loginput" placeholder="What got in the way? (optional)" value="${esc(x.friction)}" data-friction="${t.id}">`:''}`}).join(''):'<p class="empty">No practices yet. Add one to begin tracking.</p>'}<div style="display:flex;justify-content:flex-end;margin-top:17px"><button class="primary" id="saveLog">Save today’s check-in</button></div></div><div class="card logside"><div class="cardtitle">What gets measured gets clearer</div><div class="cardhint">A few useful signals—not a scorecard.</div><div class="coach" style="margin-top:18px"><div class="coachlabel">✳ &nbsp;A good log is small</div><p>Mark what you did. Add a number if you track time, reps, or weight. If a session didn’t happen, jot down why. That’s enough to make your next review more useful.</p></div><div style="margin-top:20px;font-size:11px;color:var(--muted);line-height:1.9">YOUR RHYTHM THIS WEEK<br><strong style="font:700 25px Manrope;color:var(--ink)">${overall(7)}%</strong><br>completion across assigned sessions</div></div></div>`}
function renderReports(){let tasks=state.tasks;let friction={};for(let i=0;i<30;i++)Object.values(state.logs[plusDays(-i)]||{}).forEach(x=>{if(x.friction)friction[x.friction]=(friction[x.friction]||0)+1});let f=Object.entries(friction).sort((a,b)=>b[1]-a[1]);let skillRows=tasks.filter(t=>t.type==='quantitative').map(t=>{let p=improvement(t.id);return `<div class="tablerow"><span style="font-weight:600">${esc(t.name)}</span><span>${avgMetric(t.id,7)?avgMetric(t.id,7).toFixed(0)+' '+esc(t.unit):'—'}</span><span>${avgMetric(t.id,30)?avgMetric(t.id,30).toFixed(0)+' '+esc(t.unit):'—'}</span><span class="${p>0?'trend':''}">${p===null?'Need more data':(p>0?'+':'')+p+'%'}</span></div>`}).join('');return `<div class="pagehead"><div><div class="eyebrow">Weekly & monthly review</div><h1>The picture behind the practice.</h1><p class="subtitle">See what you completed, what’s moving, and what may be getting in the way.</p></div><button class="secondary" id="exportData">↓ &nbsp;Export data</button></div><div class="grid"><div class="card stat reportcards"><div class="stat-top">7-day completion</div><div class="stat-value">${overall(7)}%</div><div class="stat-foot">${state.tasks.reduce((s,t)=>s+completed(t,7),0)} completed sessions</div></div><div class="card stat reportcards"><div class="stat-top">30-day completion</div><div class="stat-value">${overall(30)}%</div><div class="stat-foot">${state.tasks.reduce((s,t)=>s+completed(t,30),0)} completed sessions</div></div><div class="card stat reportcards"><div class="stat-top">Friction notes</div><div class="stat-value">${Object.values(friction).reduce((a,b)=>a+b,0)}</div><div class="stat-foot">Captured in the last 30 days</div></div><div class="card reportlist"><div class="cardhead"><div><div class="cardtitle">Practice consistency</div><div class="cardhint">Completed sessions vs. assigned, by practice</div></div></div><div class="barlist">${tasks.map(t=>{let c=completed(t,30),a=assigned(t,30);return `<div class="barline"><span>${esc(t.name)}</span><div class="progressline"><span style="width:${pct(c,a)}%"></span></div><b>${pct(c,a)}%</b></div>`}).join('')||'<p class="empty">Add practices to see a report.</p>'}</div></div><div class="card reportcards"><div class="cardtitle">Where sessions slipped</div><div class="cardhint">Most common friction notes</div>${f.length?f.slice(0,5).map(([s,n])=>`<div class="friction-item"><span>${esc(s)}</span><b>${n}</b></div>`).join(''):'<div class="empty">Add a note when a session gets missed. Patterns will show up here.</div>'}</div><div class="card" style="grid-column:span 12"><div class="cardhead"><div><div class="cardtitle">Quantitative progress</div><div class="cardhint">Recent 7-day average compared with the latest 30 days; trend compares the earlier and later halves of logged sessions.</div></div></div><div class="tablehead"><span>Practice</span><span>7-day avg</span><span>30-day avg</span><span>Trend</span></div>${skillRows||'<div class="empty">Add a number-based practice and log a few sessions to see skill progression here.</div>'}</div></div>`}
function renderCoach(){let a=coachAdvice(),comp=overall(7),notes=[];let im=state.tasks.filter(t=>t.type==='quantitative').map(t=>({t,p:improvement(t.id)}));let best=im.filter(x=>x.p!==null).sort((x,y)=>y.p-x.p)[0],low=im.filter(x=>x.p!==null).sort((x,y)=>x.p-y.p)[0];if(best&&best.p>0)notes.push({tag:'GROWING',title:best.t.name,body:`Your recent sessions are trending ${best.p}% above the earlier ones. Keep the conditions that are working and build gradually.`});if(low&&low.p<5)notes.push({tag:'PLATEAU WATCH',title:low.t.name,body:`You’re still putting in the sessions, while recent numbers have stayed fairly level. Consider one manageable new challenge or constraint.`});let fr=0;for(let i=0;i<7;i++)Object.values(state.logs[plusDays(-i)]||{}).forEach(x=>{if(x.friction)fr++});if(comp<70&&fr)notes.push({tag:'FRICTION',title:'Make the starting line easier',body:`You recorded ${fr} friction note${fr===1?'':'s'} this week. Try a shorter minimum session or split one practice into two small steps.`});if(!notes.length)notes.push({tag:'NEXT STEP',title:'Collect a little more signal',body:'Log a couple of sessions with a measurable result. Then we can compare consistency with the skill change you care about.'});return `<div class="pagehead"><div><div class="eyebrow">A thoughtful practice partner</div><h1>Your coaching notes.</h1><p class="subtitle">Specific reflections based on your check-ins. Take what helps, leave the rest.</p></div></div><div class="grid"><div class="card" style="grid-column:span 7;background:#f1f4ec"><div class="coachlabel">✳ &nbsp;THIS WEEK’S READ</div><h2 style="font:700 22px Manrope;letter-spacing:-.6px;margin:13px 0 8px">${esc(a.title)}</h2><p style="line-height:1.75;color:#5d6459;font-size:13px">${esc(a.body)}</p><div class="cardhint" style="margin-top:18px">Grounded in your ${overall(7)}% weekly completion rate${fr?' and '+fr+' friction note'+(fr===1?'':'s'):''}.</div></div><div class="card" style="grid-column:span 5"><div class="cardtitle">Your coaching lens</div><div class="cardhint">Patterns from the last 7 days</div><div class="friction-item"><span>Practice completion</span><b>${comp}%</b></div><div class="friction-item"><span>Quantitative practices</span><b>${state.tasks.filter(t=>t.type==='quantitative').length}</b></div><div class="friction-item"><span>Friction notes</span><b>${fr}</b></div></div>${notes.map(n=>`<div class="card" style="grid-column:span 4"><div class="eyebrow" style="font-size:9px">${n.tag}</div><div class="cardtitle">${esc(n.title)}</div><p style="font-size:12px;color:#72776e;line-height:1.65">${esc(n.body)}</p></div>`).join('')}<div class="card" style="grid-column:span 12"><div class="cardtitle">How this coaching works</div><p style="font-size:12px;color:#72776e;line-height:1.7;margin-bottom:0">These notes use clear patterns from your own logs: steady practice with flat results, missed sessions and their friction notes, and changes in day-to-day rhythm. Advice stays small and tied to the signal in your data.</p></div></div>`}
function renderSettings(){return `<div class="pagehead"><div><div class="eyebrow">Make it yours</div><h1>Your workspace.</h1><p class="subtitle">Choose what you’re working toward and tune your practices.</p></div></div><div class="grid"><div class="card settings"><div class="cardtitle">Profile</div><div class="field"><label>Your name</label><input id="profileName" value="${esc(state.user)}"></div><button class="primary" id="saveProfile">Save changes</button><div class="sectiontitle">Your practices</div>${state.tasks.map(t=>`<div class="logrow"><div><div class="logtask">${esc(t.name)}</div><div class="logdetail">${esc(t.category)} · ${esc(t.frequency)} · ${t.type==='quantitative'?'Tracks '+esc(t.unit):'Done / not yet'}</div></div><button class="secondary" data-delete="${t.id}">Remove</button></div>`).join('')||'<p class="empty">No practices yet.</p>'}<div style="margin-top:15px"><button class="secondary" id="addTaskSettings">＋ Add a practice</button></div></div><div class="card settings-side"><div class="cardtitle">Your improvement focus</div><div class="cardhint">Pick a result that matters to you. Start small and track the signal.</div><div class="field"><label>What would you like to improve?</label><input id="goalText" placeholder="e.g. Spend less time editing vocals" value="${esc(state.goal||'')}"></div><div class="field"><label>Target (optional)</label><input id="goalTarget" placeholder="e.g. 15% less by next month" value="${esc(state.goalTarget||'')}"></div><button class="primary" id="saveGoal">Save focus</button><div class="coach" style="margin-top:20px"><div class="coachlabel">✳ &nbsp;Keep expectations kind</div><p>Log results consistently before judging the trend. A few sessions give you a starting point; a month gives you a more useful comparison.</p></div><div style="margin-top:20px"><button class="secondary" id="resetData">Restore sample data</button></div></div></div>`}
function render(){document.getElementById('crumb').textContent={overview:'Overview',log:'Daily log',reports:'Reports',coach:'Your coach',settings:'Settings'}[currentPage];let date=new Date();document.getElementById('datePill').textContent=date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});document.getElementById('content').innerHTML=({overview:renderOverview,log:renderLog,reports:renderReports,coach:renderCoach,settings:renderSettings}[currentPage])();bind()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function toggle(id){state.logs[today()]??={};let x=state.logs[today()][id]||{done:false,value:'',friction:''};x.done=!x.done;state.logs[today()][id]=x;save();render()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{currentPage=b.dataset.goto;document.querySelector('[data-page="coach"]').classList.add('active');render()});document.querySelectorAll('[data-value]').forEach(i=>i.onchange=()=>{state.logs[today()]??={};let x=state.logs[today()][i.dataset.value]||{done:false,value:'',friction:''};x.value=i.value;if(i.value!==''&&Number(i.value)>0)x.done=true;state.logs[today()][i.dataset.value]=x;save()});document.querySelectorAll('[data-friction]').forEach(i=>i.onchange=()=>{state.logs[today()]??={};let x=state.logs[today()][i.dataset.friction]||{done:false,value:'',friction:''};x.friction=i.value;state.logs[today()][i.dataset.friction]=x;save()});let add=()=>openModal();['addTask','addTaskSettings'].forEach(id=>{let b=document.getElementById(id);if(b)b.onclick=add});let sv=document.getElementById('saveLog');if(sv)sv.onclick=()=>{document.querySelectorAll('[data-value]').forEach(i=>{let x=logFor(today(),i.dataset.value);x.value=i.value;if(i.value&&Number(i.value)>0)x.done=true;state.logs[today()][i.dataset.value]=x});document.querySelectorAll('[data-friction]').forEach(i=>{let x=logFor(today(),i.dataset.friction);x.friction=i.value;state.logs[today()][i.dataset.friction]=x});save();render();toast('Today’s check-in is saved.')};let profile=document.getElementById('saveProfile');if(profile)profile.onclick=()=>{state.user=document.getElementById('profileName').value.trim()||'Friend';save();document.getElementById('userName').textContent=state.user+"'s practice";render();toast('Profile updated.')};let goal=document.getElementById('saveGoal');if(goal)goal.onclick=()=>{state.goal=document.getElementById('goalText').value;state.goalTarget=document.getElementById('goalTarget').value;save();toast('Focus saved.')};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Remove this practice? Past logs are kept in your local data.')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.delete);save();render();toast('Practice removed.')}});let ex=document.getElementById('exportData');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='steady-practice-data.json';a.click();URL.revokeObjectURL(a.href)};let reset=document.getElementById('resetData');if(reset)reset.onclick=()=>{if(confirm('Restore the sample workspace? This replaces your current practices and logs.')){state=starter();save();render();toast('Sample workspace restored.')}}}
function openModal(){document.getElementById('modal').classList.add('open');document.getElementById('newName').focus()}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('chosen',x===b));document.getElementById('unitField').style.display=selectedType==='quantitative'?'grid':'none';document.getElementById('directionField').style.display=selectedType==='quantitative'?'grid':'none'});document.getElementById('saveTask').onclick=()=>{let name=document.getElementById('newName').value.trim();if(!name){document.getElementById('newName').focus();return}state.tasks.push({id:uid(),name,category:document.getElementById('newCategory').value,frequency:document.getElementById('newFrequency').value,type:selectedType,unit:document.getElementById('newUnit').value.trim(),direction:document.getElementById('newDirection').value,target:document.getElementById('newTarget').value.trim(),created:today()});save();closeModal();render();toast('Practice added.')};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script><script src="app-bridge.js"></script><script src="admin.js"></script><script src="timer.js"></script><script src="cloud-config.js"></script><script src="cloud.js"></script></body></html>
